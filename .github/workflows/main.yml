name: Build RAJ Walkie Talkie FIXED

on:
  workflow_dispatch:
  push:
    paths:
      - "RAJ-Walkie-Talkie-NEW-GRADLE89-FIXED.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract FIXED project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="./RAJ-Walkie-Talkie-NEW-GRADLE89-FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found."
            echo "Available ZIP files:"
            find . -maxdepth 1 -type f -iname "*.zip" -print
            exit 1
          fi

          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q "$ZIP_FILE" -d buildsrc

          test -f buildsrc/settings.gradle
          test -f buildsrc/build.gradle
          test -f buildsrc/app/build.gradle
          test -f buildsrc/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build FIXED Debug APK
        working-directory: buildsrc
        run: |
          gradle --version
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f buildsrc/app/build/outputs/apk/debug/app-debug.apk
          ls -lh buildsrc/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload FIXED APK
        uses: actions/upload-artifact@v4
        with:
          name: RAJ-Walkie-Talkie-NEW-GRADLE89-FIXED-debug
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
