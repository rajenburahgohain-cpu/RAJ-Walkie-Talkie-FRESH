name: Build RAJ Walkie Talkie NEW

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract NEW project
        run: |
          set -e
          test -f "./RAJ-Walkie-Talkie-NEW.zip"
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q "./RAJ-Walkie-Talkie-NEW.zip" -d buildsrc

      - name: Verify project
        run: |
          test -f "buildsrc/settings.gradle"
          test -f "buildsrc/app/build.gradle"
          test -f "buildsrc/app/src/main/java/com/raj/walkietalkie/MainActivity.java"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: buildsrc
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload NEW APK
        uses: actions/upload-artifact@v4
        with:
          name: RAJ-Walkie-Talkie-NEW-debug
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
