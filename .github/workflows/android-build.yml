name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select microphone foreground fix ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE="./RAJ-Walkie-Talkie-MICROPHONE-FOREGROUND-FIX.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Required ZIP not found: $ZIP_FILE"
            ls -la
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Using: $ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q "${{ steps.zip.outputs.ZIP_FILE }}" -d extracted
          cp -a extracted/. .
          echo "Project extracted successfully."
          find . -maxdepth 3 -type f \( -name settings.gradle -o -name build.gradle -o -name gradlew \) -print

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        run: |
          chmod +x gradlew || true
          gradle :app:assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RAJ-Walkie-Talkie-MICROPHONE-FOREGROUND-FIX
          path: app/build/outputs/apk/debug/app-debug.apk
