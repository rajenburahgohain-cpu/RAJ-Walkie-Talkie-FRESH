name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP file found."
            ls -la
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Found: $ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q "${{ steps.zip.outputs.ZIP_FILE }}" -d extracted

          cp -a extracted/. .

          echo "Project extracted successfully."
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RAJ-Walkie-Talkie-debug
          path: app/build/outputs/apk/debug/app-debug.apk
